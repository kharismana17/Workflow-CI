name: Retrain Model

on:
  push:

jobs:
  train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MLProject

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python Membangun_model/modelling.py