name: Retrain Model

on:
  push:
    branches:
      - main

jobs:
  retrain:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install mlflow
          pip install pandas
          pip install scikit-learn

      - name: Run MLflow Project
        run: |
          mlflow run . -e main